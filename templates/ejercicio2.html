<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ejercicio2</title>
    <link rel="stylesheet" href="/static/Ejercicio2styles.css">
</head>
<body>
    <h1>Inicio de sesión</h1>

    <a href="{{ url_for('index') }}" class="link-volver">Volver al menú</a>

    <div class="form-container">
        <form method="POST" action="{{ url_for('ejercicio2') }}">
          <label for="usuario">Ingresa tu nombre</label>
          <input type="text" id="usuario" name="usuario" required>

          <label for="contrasena">Ingresa tu contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required>

          <button type="submit">Verificar</button>
        </form>
    </div>

    {% if mensaje is defined %}
    <div class="mensaje">
        {{ mensaje }}
    </div>
    {% endif %}
</body>
</html>
